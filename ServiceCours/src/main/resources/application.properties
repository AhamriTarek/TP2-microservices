spring.application.name=service-cours
server.port=8082
server.error.include-message=always

# Adresse de ServiceEtudiants.
# En local : localhost. Dans Docker, docker-compose remplace cette valeur
# par la variable d'environnement ETUDIANTS_SERVICE_URL=http://etudiants:8081
etudiants.service.url=${ETUDIANTS_SERVICE_URL:http://localhost:8081}
